40 PROBLÈMES D'AJUSTEMENT (numéro · problème · ce qu'on voit · cause probable · correction) :
[Corset · le haut]
1 · Le décolleté bâille et s'écarte du corps · Il y a de l'air entre le bord supérieur et la poitrine · Cause : Le tour de poitrine du patron est plus grand que celui de la cliente, ou le bord supérieur est trop haut · Correction : Pincez l'excédent sur la toile d'essai et marquez-le ; retirez cette valeur en la répartissant sur les coutures du devant et du côté, uniquement sur la ligne de poitrine, et adoucissez la courbe vers la taille.
2 · Il comprime la poitrine en haut (« effet débordement ») · La poitrine dépasse au-dessus du bord · Cause : Il manque du tour de poitrine, ou les bonnets du patron sont trop petits pour sa poitrine · Correction : Ouvrez la couture des panneaux de poitrine et ajoutez ce qui manque, réparti entre les panneaux avant ; si le décolleté est trop bas pour sa poitrine, remontez le bord supérieur.

4 · Les bonnets baillent ou forment un creux · Le tissu ne repose pas sur la poitrine · Cause : La projection du bonnet est plus grande que celle de la poitrine de la cliente · Correction : Réduisez la courbe de la couture de poitrine (retirez du volume au sommet de la courbe) et essayez à nouveau ; ne réduisez pas le tour.
5 · Le bord supérieur rentre sous les bras · Ça gêne quand elle baisse les bras · Cause : Le côté est trop haut · Correction : Abaissez progressivement le bord supérieur sur le côté, de 1 à 2 cm, et raccordez la courbe avec le devant et le dos.
6 · Il paraît plat et ne dessine pas la poitrine · Le devant reste droit · Cause : Le patron a une silhouette droite, ou la cliente a plus de poitrine que le patron de base · Correction : Ajoutez de la courbe aux coutures des panneaux de poitrine ou choisissez un patron avec plus de projection.
7 · Le busc se courbe ou s'écarte en haut · La fermeture devant ne repose pas bien droite · Cause : Trop de tension sur la poitrine, ou le busc est plus long que la partie droite du buste · Correction : Vérifiez le tour de poitrine ; si le problème persiste, choisissez un busc plus court ou un busc courbé.
8 · Les bretelles du soutien-gorge dépassent ou ça ne va pas avec la lingerie · Ça ne s'accorde pas avec ce qu'elle porte dessous · Cause : L'essayage a été fait sans la lingerie qu'elle va porter · Correction : Refaites l'essayage avec la lingerie définitive ou ajoutez des bretelles au corset.
[Corset · taille et hanches]
9 · Pli à la taille sur le côté · Des plis en diagonale à hauteur de la taille · Cause : La ligne de taille du patron ne correspond pas à sa taille réelle · Correction : Marquez sa taille réelle sur la toile d'essai avec un ruban et remontez ou descendez la ligne de taille du patron sur tous les panneaux.
10 · Il serre trop à la taille · Ça fait mal ou ça laisse des marques · Cause : Réduction de taille plus grande que ce que la cliente supporte · Correction : Ajoutez de l'ampleur à la taille, répartie sur toutes les coutures ; un corset pensé pour être porté confortablement n'a pas besoin d'une grande réduction.
11 · Il rentre dans les hanches quand elle s'assoit · Ça gêne en position assise · Cause : La longueur sous la taille est plus grande que sa distance taille-cuisse assise · Correction : Raccourcissez le bord inférieur devant et sur le côté, ou donnez-lui plus de courbe vers le haut sur le devant.
12 · Il s'écarte des hanches · Il y a de l'air au niveau des hanches · Cause : Le tour de hanches du patron est plus grand que le sien · Correction : Retirez l'excédent dans les coutures latérales et arrière, uniquement dans la zone des hanches, en gardant la taille.
13 · Il serre les hanches et remonte · Le corset remonte quand elle bouge · Cause : Il manque du tour de hanches, alors le corps le pousse vers le haut · Correction : Ajoutez de l'ampleur aux hanches, répartie sur les coutures latérales et arrière.
14 · Il vrille d'un côté · Les coutures partent en diagonale · Cause : Panneaux coupés hors du droit-fil, ou corps asymétrique · Correction : Vérifiez le droit-fil de chaque pièce ; si le corps est asymétrique, ajustez uniquement le côté qui en a besoin.
15 · Les baleines marquent ou sortent de la coulisse · On voit le bout de la baleine · Cause : Baleines plus longues que la coulisse, ou coulisse mal fermée · Correction : Coupez la baleine 1 cm plus court que la coulisse et protégez les extrémités ; fermez bien la coulisse avant le biais.
16 · Le tissu ondule entre deux baleines · Des vagues sur le tissu extérieur · Cause : Tissu extérieur sans couche ferme, ou mal assemblé au coutil · Correction : Assemblez le tissu extérieur au coutil (ou entoilez-le) avant de monter les panneaux.

24 · L'armature rentre sous le bras · Ça gêne sur le côté · Cause : Armature plus longue ou plus large que la base de la poitrine · Correction : Utilisez une armature d'une taille en dessous, ou plus courte sur le côté.

35 · La toile d'essai allait bien mais pas la pièce finale · Ce qui allait bien ne va plus · Cause : Le tissu final ne se tient pas comme celui de la toile d'essai · Correction : Faites la toile d'essai dans un tissu au comportement proche, ou entoilez le tissu final.
36 · Ça va debout mais pas assise · Ça gêne en position assise · Cause : L'essayage a été fait uniquement debout · Correction : À chaque essayage, demandez-lui de s'asseoir, de lever les bras et de se pencher.

39 · Ça lui va bien mais elle ne se sent pas à l'aise · La pièce est « réussie » mais elle ne veut pas la porter · Cause : Écart entre ce qu'elle attendait et ce qui a été fait · Correction : Lors du premier échange, demandez-lui pour quoi elle la porte et quel niveau de maintien elle aime ; notez-le sur la fiche.
40 · Le tissu se déforme à force d'essayages · La toile d'essai est détendue · Cause : Beaucoup d'essayages sur la même toile · Correction : Après deux grosses corrections, coupez une nouvelle toile d'essai avec le patron corrigé.

LES 14 MESURES (de « Comment Prendre les Mesures de Votre Cliente ») :
1. Tour de poitrine : Sur la partie la plus forte de la poitrine, le mètre ruban à l'horizontale et sans serrer.
2. Tour sous-poitrine : Juste sous la poitrine, là où repose la bande du soutien-gorge. Ferme mais sans serrer.
3. Tour de taille : Sur la partie la plus fine du buste. Nouez un ruban et demandez-lui de bouger : le ruban descend tout seul à sa taille.
4. Tour de hanches haut : Environ 10 cm sous la taille, à hauteur des os du bassin.
5. Tour de hanches : Sur la partie la plus forte des fesses, pieds joints.
6. Longueur taille devant : Du creux entre les clavicules jusqu'à la taille, en passant par le milieu.
7. Longueur taille dos : De la vertèbre saillante à la base du cou jusqu'à la taille.
8. Hauteur de poitrine : Du point où l'épaule rejoint le cou jusqu'à la pointe de la poitrine.
9. Écart de poitrine : La distance entre les deux pointes de la poitrine.
10. Sous-poitrine à taille : Sur le devant, de la ligne sous-poitrine jusqu'à la taille.
11. Taille à hanches (hauteur) : Sur le côté, de la taille jusqu'à la partie la plus forte des hanches.
12. Carrure dos : D'aisselle à aisselle en passant par le dos, les bras relâchés.
13. Taille à cuisse assise : Assise, sur le devant, de la taille jusqu'au pli de la jambe. Elle définit la longueur maximale du corset.
14. Longueur de buste (pour les bodys) : De l'épaule, par le devant, en passant par l'entrejambe, jusqu'à la même épaule par le dos.

GUIDE POUR ADAPTER LE PATRON À VOTRE CLIENTE : comparer patron et cliente en poitrine, sous-poitrine, taille, hanches haut et hanches (demi-corps, sans valeurs de couture) ; répartir la différence sur tous les bords de couture verticaux de la moitié du patron, sans toucher au milieu devant (busc) ni au milieu dos (œillets) ; raccorder par des courbes douces ; si la différence est inégale, davantage sur les panneaux du côté et des hanches. Longueur : ligne horizontale entre la sous-poitrine et la taille (et entre la taille et les hanches), couper et écarter pour allonger, superposer pour raccourcir. Bonnet : plus ou moins de courbe aux coutures de poitrine sans changer le tour. Lingerie : bande au tour sous-poitrine avec l'élasticité du tissu ; body = longueur de buste, se corrige à la taille ; culottes = élastique et couvrance.
PLAN DU PREMIER ESSAYAGE (ordre) : 1 fermeture (ouverture du dos régulière de 4 à 5 cm) · 2 longueur (taille sur sa taille, elle peut s'asseoir) · 3 tour (pincer et marquer) · 4 forme (bonnets, courbes, plis) · 5 mouvement (s'asseoir, bras, se pencher) · 6 confort · 7 photos. Ensuite : reporter les corrections sur le patron ; après deux grosses corrections, nouvelle toile d'essai.
RÈGLE D'OR : toujours une toile d'essai avant le tissu final ; corriger une chose à la fois, dans l'ordre longueur → tour → forme.`

    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
</script>
