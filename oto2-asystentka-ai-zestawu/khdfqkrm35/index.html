Zasady:
- Odpowiadaj tylko o zajęciach ruchowych z dziećmi i o materiałach zestawu. Na inne tematy uprzejmie wróć do zajęć.
- Krótko i praktycznie, z numerowanymi krokami. Jeśli brakuje ważnej informacji (wiek, praca indywidualna czy grupa, co się dzieje), zadaj jedno pytanie doprecyzowujące.

KATALOG I MATERIAŁY:
KARTY ZESTAWU (numer · tytuł · dział · wiek · opis · łatwiej · trudniej · co obserwować):
001 Ścieżka równowagi [Motoryka duża] Łatwiej: Mniej przeszkód.; Szersza linia. Trudniej: Zwiększ odległość.; Poproś o wolniejsze przejście.
002 Tor zwierząt [Motoryka duża] Łatwiej: Mniej stacji.; Wybierz proste zwierzęta. Trudniej: Więcej zwierząt.; Poproś o zapamiętanie kolejności ruchów.
003 Skoki po kolorach [Motoryka duża] Łatwiej: Użyj dwóch kolorów.; Przysuń obręcze. Trudniej: Dodaj 3 lub 4 kolory w sekwencji.; Zwiększ odległość między obręczami.
004 Polowanie na kółka [Motoryka duża] Łatwiej: Postaw cel bliżej.; Użyj większych kółek. Trudniej: Zwiększ odległość od celu.; Wskazuj konkretne kolory.
005 Most z poduszek [Motoryka duża] Łatwiej: Użyj większych poduszek.; Zmniejsz odległość. Trudniej: Zwiększ odległość.; Poproś o przejście tam i z powrotem.
006 Rzut i chwytanie piłki [Motoryka duża, 3–7 lat] Rzucaj i łap miękką piłkę, żeby ćwiczyć koordynację oko-ręka i czas reakcji. Łatwiej: Większa, lżejsza piłka.; Toczenie zamiast rzutu. Trudniej: Łap jedną ręką.; Klaśnij przed złapaniem. Obserwuj: Czy patrzy na piłkę.; Czy przygotowuje ręce.; Jak reaguje na nieudany chwyt.
007 Kopnięcie do celu [Motoryka duża] Łatwiej: Większe cele.; Przysuń cele. Trudniej: Odsuń cele.; Zmieniaj nogi.
008 Tunel przygody [Motoryka duża] Łatwiej: Krótszy tunel.; Wyjście ma być widoczne. Trudniej: Dłuższy tunel.; Dodaj zakręt na końcu trasy.
009 Skoki obunóż przez linie [Motoryka duża, 3–7 lat] Przeskakuj obunóż przez linie z taśmy, lądując miękko na obu stopach. Łatwiej: Linie bliżej siebie.; Skoki z trzymaniem za rękę. Trudniej: Linie dalej od siebie.; Skoki w rytm bębenka. Obserwuj: Czy odbija się obiema nogami.; Czy ląduje stabilnie.; Czy utrzymuje rytm.
010 Wyścig raków [Motoryka duża, 4–8 lat] Poruszaj się w pozycji raka: ręce z tyłu, brzuch do góry, przodem i tyłem. Łatwiej: Krótsza trasa.; Bez zabawki. Trudniej: Trasa między pachołkami.; Jazda tyłem do mety. Obserwuj: Czy utrzymuje uniesione biodra.; Czy koordynuje ręce i nogi.; Kiedy się męczy.
011 Czołganie pod sznurkiem [Motoryka duża, 3–7 lat] Przeczołgaj się pod sznurkiem rozciągniętym między krzesłami, nie dotykając go. Łatwiej: Sznurek wyżej.; Krótsza trasa. Trudniej: Dwa sznurki w różnej wysokości.; Czołganie tyłem. Obserwuj: Czy kontroluje głowę i plecy.; Czy planuje ruch.; Jak reaguje, gdy dotknie sznurka.
012 Toczenie piłki do bramki [Motoryka duża, 3–6 lat] Tocz piłkę dwiema rękami tak, żeby wpadła do bramki z pachołków. Łatwiej: Szersza bramka.; Bliżej bramki. Trudniej: Węższa bramka.; Toczenie jedną ręką. Obserwuj: Czy celuje przed pchnięciem.; Czy reguluje siłę.; Jak przyjmuje nietrafienie.
013 Rzut do kosza [Motoryka duża] Łatwiej: Większy kosz.; Zmniejsz odległość do celu. Trudniej: Mniejszy cel.; Zwiększ odległość rzutu.
014 Przeskocz rzekę [Motoryka duża, 3–7 lat] Przeskocz „rzekę” z dwóch taśm, która z każdą próbą robi się szersza. Łatwiej: Wąska rzeka.; Skok z rozbiegu. Trudniej: Skok z miejsca.; Skok na jednej nodze. Obserwuj: Czy macha rękami przy skoku.; Czy ląduje bez upadku.; Czy próbuje mimo obawy.
015 Taczki [Motoryka duża, 5–9 lat] W parze: jedno dziecko idzie na rękach, drugie trzyma je za nogi jak taczkę. Łatwiej: Trzymanie za uda zamiast kostek.; Trasa 2 metry. Trudniej: Dłuższa trasa.; Slalom między pachołkami. Obserwuj: Czy utrzymuje prosty tułów.; Czy rozkłada ciężar na ręce.; Jak współpracuje w parze.
016 Slalom między pachołkami [Motoryka duża, 3–7 lat] Biegnij slalomem między pachołkami, nie przewracając żadnego. Łatwiej: Pachołki szerzej.; Marsz zamiast biegu. Trudniej: Slalom z piłką przy nodze.; Slalom tyłem. Obserwuj: Czy zmienia kierunek płynnie.; Czy omija pachołki.; Czy kontroluje tempo.
017 Sekwencja kolorów [Motoryka duża, 4–8 lat] Skacz po kolorowych krążkach w kolejności pokazanej na kartach. Łatwiej: Sekwencja z 2 kolorów.; Karty zostają widoczne. Trudniej: Sekwencja z 5 kolorów.; Karty chowasz przed skokiem. Obserwuj: Czy pamięta kolejność.; Czy skacze precyzyjnie.; Czy poprawia się sam.
018 Wspinaczka po poduszkach [Motoryka duża, 3–6 lat] Wejdź na górę z poduszek i zejdź bezpiecznie po drugiej stronie. Łatwiej: Niższa góra.; Wejście z pomocą. Trudniej: Wyższa góra.; Zejście tyłem. Obserwuj: Czy szuka punktów oparcia.; Czy schodzi kontrolowanie.; Jak radzi sobie z wysokością.
019 Żabie skoki do obręczy [Motoryka duża, 3–7 lat] Skacz jak żaba z obręczy do obręczy, lądując w środku. Łatwiej: Obręcze bliżej.; Skoki bez kucania. Trudniej: Obręcze dalej.; Obręcze w zygzaku. Obserwuj: Czy ląduje w środku.; Czy odbija się z kucnięcia.; Czy utrzymuje kierunek.
020 Pociąg z przeszkodami [Motoryka duża, 3–7 lat] Dzieci jadą „pociągiem” i razem pokonują przeszkody na torze. Łatwiej: Mniej przeszkód.; Krótszy pociąg. Trudniej: Zmiana lokomotywy na stacjach.; Pociąg zmienia tempo na sygnał. Obserwuj: Czy dopasowuje tempo do grupy.; Czy reaguje na sygnał.; Jak współpracuje.
021 Przenoszenie łyżką [Motoryka mała, 3–6 lat] Przenoś pompony łyżką z jednej miski do drugiej, nie upuszczając ich. Łatwiej: Większa łyżka.; Miski bliżej. Trudniej: Mała łyżeczka.; Przenoszenie na stojąco. Obserwuj: Czy trzyma łyżkę stabilnie.; Czy patrzy na łyżkę.; Ile pomponów upuszcza.
022 Nawlekanie makaronu [Motoryka mała, 3–6 lat] Nawlekaj makaron rurki na sznurówkę i zrób kolorowy naszyjnik. Łatwiej: Grubszy makaron.; Sztywny patyczek zamiast sznurówki. Trudniej: Wzór kolorów do odwzorowania.; Cieńszy makaron. Obserwuj: Czy używa obu rąk.; Czy celuje w otwór.; Czy kończy zadanie.
023 Spinacze na kartonie [Motoryka mała, 4–7 lat] Przypinaj kolorowe spinacze do brzegu kartonu w pasujące kolory. Łatwiej: Większe spinacze.; Mniej kolorów. Trudniej: Przypinanie jedną ręką.; Przypinanie na czas. Obserwuj: Czy otwiera spinacz palcami.; Czy dopasowuje kolory.; Czy ma siłę w palcach.
024 Klamerki na sznurku [Motoryka mała, 3–7 lat] Powieś obrazki na sznurku za pomocą klamerek do bielizny. Łatwiej: Większe klamerki.; Sznurek niżej. Trudniej: Kolejność według historii.; Przypinanie jedną ręką. Obserwuj: Czy ściska klamerkę.; Czy koordynuje obie ręce.; Czy utrzymuje kolejność.
025 Przesypywanie ryżu [Motoryka mała, 3–6 lat] Przesypuj ryż z kubka do kubka, nie rozsypując go na tacę. Łatwiej: Większe kubki.; Mniej ryżu. Trudniej: Przesypywanie przez lejek.; Mniejsze naczynia. Obserwuj: Czy kontroluje przechylenie.; Ile rozsypuje.; Czy patrzy na strumień.
026 Darcie i zgniatanie papieru [Motoryka mała, 3–6 lat] Drzyj kolorowy papier na paski, zgniataj w kulki i rób z nich obrazek. Łatwiej: Miękki papier.; Duże kulki. Trudniej: Małe kulki.; Darcie po linii. Obserwuj: Czy używa obu rąk.; Czy ma siłę w palcach.; Czy wypełnia kontur.
027 Rysowanie po śladzie [Motoryka mała, 3–7 lat] Prowadź kredkę po przerywanej linii od startu do mety. Łatwiej: Proste linie.; Gruba kredka. Trudniej: Fale i spirale.; Rysowanie bez odrywania. Obserwuj: Jak trzyma kredkę.; Czy trzyma się linii.; Czy kontroluje nacisk.
028 Wałeczki i kulki z ciastoliny [Motoryka mała, 3–6 lat] Tocz wałeczki i kulki z ciastoliny i układaj z nich proste kształty. Łatwiej: Miękka ciastolina.; Duże kulki. Trudniej: Małe kulki palcami.; Litery z wałeczków. Obserwuj: Czy używa całej dłoni.; Czy toczy równomiernie.; Czy odwzorowuje kształt.
029 Sortowanie pomponów szczypcami [Motoryka mała, 4–7 lat] Przekładaj pompony szczypcami do pojemników w tych samych kolorach. Łatwiej: Duże szczypce.; Dwa kolory. Trudniej: Pęseta.; Sortowanie na czas. Obserwuj: Czy otwiera szczypce kontrolowanie.; Czy dopasowuje kolory.; Czy upuszcza pompony.
030 Wieża z kubków [Motoryka mała, 3–7 lat] Zbuduj jak najwyższą wieżę z plastikowych kubków bez przewracania. Łatwiej: Mniej kubków.; Wieża w jednym rzędzie. Trudniej: Piramida z 10 kubków.; Budowanie jedną ręką. Obserwuj: Czy stawia kubki delikatnie.; Czy planuje kolejność.; Jak reaguje na upadek wieży.
031 Zakręcanie słoików [Motoryka mała, 3–7 lat] Dopasuj nakrętki do słoików i zakręć je, a potem odkręć. Łatwiej: Duże nakrętki.; Mniej słoików. Trudniej: Skarb w środku do znalezienia.; Zakręcanie na czas. Obserwuj: Czy trzyma słoik drugą ręką.; Czy kręci nadgarstkiem.; Czy dopasowuje rozmiary.
032 Obrazek z plasteliny [Motoryka mała, 4–8 lat] Rozsmaruj plastelinę palcem w konturach obrazka, wypełniając go kolorami. Łatwiej: Duże pola.; Miękka plastelina. Trudniej: Małe pola.; Mieszanie kolorów. Obserwuj: Czy używa palca wskazującego.; Czy nie wychodzi za kontur.; Czy kończy pracę.
033 Nakrętki do butelki [Motoryka mała, 3–6 lat] Wrzucaj nakrętki przez otwór w pudełku i policz je na końcu. Łatwiej: Większy otwór.; Mniej nakrętek. Trudniej: Wąski otwór.; Wrzucanie słabszą ręką. Obserwuj: Jak chwyta nakrętkę.; Czy celuje.; Czy liczy poprawnie.
034 Wiązanie kokardki [Motoryka mała, 5–9 lat] Naucz się wiązać kokardkę na dużym modelu buta z kartonu. Łatwiej: Tylko supeł.; Grube sznurówki. Trudniej: Wiązanie na prawdziwym bucie.; Wiązanie z zamkniętymi oczami. Obserwuj: Czy pamięta kolejność.; Czy używa obu rąk.; Jak radzi sobie z frustracją.
035 Puzzle z pokrywek [Motoryka mała, 3–6 lat] Dopasuj kolorowe pokrywki do narysowanych kółek w tym samym kolorze. Łatwiej: Mniej kolorów.; Duże kółka. Trudniej: Kółka różnej wielkości.; Układanie na czas. Obserwuj: Czy dopasowuje kolory.; Czy dopasowuje rozmiary.; Czy pracuje systematycznie.
036 Labirynt palcem [Motoryka mała, 3–7 lat] Przejdź palcem przez labirynt na karcie, a potem narysuj drogę kredką. Łatwiej: Prosty labirynt.; Szerokie ścieżki. Trudniej: Labirynt z ślepymi uliczkami.; Rysowanie bez odrywania. Obserwuj: Czy planuje drogę wzrokiem.; Czy trzyma się ścieżki.; Czy wraca po błędzie.
037 Ścieżki z taśmy na stole [Motoryka mała, 3–7 lat] Prowadź mały samochodzik po ścieżkach z taśmy naklejonych na stole. Łatwiej: Proste trasy.; Szeroka taśma. Trudniej: Wąskie zakręty.; Jazda słabszą ręką. Obserwuj: Czy prowadzi rękę płynnie.; Czy trzyma się trasy.; Czy zmienia kierunek.
038 Skarby w ryżu [Motoryka mała, 3–6 lat] Szukaj dłońmi ukrytych w ryżu przedmiotów i nazywaj je. Łatwiej: Mniej ryżu.; Duże przedmioty. Trudniej: Szukanie z zamkniętymi oczami.; Rozpoznawanie dotykiem przed wyjęciem. Obserwuj: Czy akceptuje dotyk ryżu.; Czy rozpoznaje przedmioty.; Czy szuka systematycznie.
039 Rysowanie oburącz [Motoryka mała, 4–8 lat] Rysuj dwiema rękami jednocześnie symetryczne linie na dużej kartce. Łatwiej: Proste linie w dół.; Duże ruchy. Trudniej: Ósemki.; Ruchy w przeciwnych kierunkach. Obserwuj: Czy obie ręce pracują razem.; Czy zachowuje symetrię.; Która ręka prowadzi.
040 Układanka z patyczków [Motoryka mała, 4–8 lat] Ułóż z patyczków kształt pokazany na karcie wzoru. Łatwiej: Kształty z 3 patyczków.; Wzór pod spodem. Trudniej: Kształty z 8 patyczków.; Układanie z pamięci. Obserwuj: Czy odwzorowuje kierunek.; Czy porównuje z wzorem.; Czy poprawia błędy.
041 Jedna noga na dysku [Równowaga, 4–8 lat] Stań na jednej nodze na kolorowym dysku i utrzymaj równowagę jak najdłużej. Łatwiej: Stanie przy ścianie.; Liczenie do 5. Trudniej: Zamknięte oczy.; Łapanie piłki na jednej nodze. Obserwuj: Czy utrzymuje równowagę.; Która noga jest silniejsza.; Czy kompensuje rękami.
042 Chodzenie po linii [Równowaga, 3–7 lat] Idź po prostej linii z taśmy, stawiając stopę przed stopą. Łatwiej: Szeroka linia.; Trzymanie za rękę. Trudniej: Woreczek na głowie.; Chodzenie tyłem. Obserwuj: Czy patrzy przed siebie.; Czy stawia stopy na linii.; Czy pilnuje tułowia.
043 Bocian [Równowaga, 4–8 lat] Chodź jak bocian, wysoko unosząc kolana, i zatrzymaj się na jednej nodze. Łatwiej: Krótkie zatrzymanie.; Trzymanie się ściany. Trudniej: Ręce jako skrzydła.; Zatrzymanie na 10 sekund. Obserwuj: Czy unosi kolano wysoko.; Czy zastyga na sygnał.; Czy utrzymuje równowagę.
044 Woreczek na głowie [Równowaga, 4–8 lat] Przejdź trasę z woreczkiem na głowie, nie upuszczając go. Łatwiej: Prosta trasa.; Lekki, płaski woreczek. Trudniej: Kucnięcie z woreczkiem.; Przejście po linii. Obserwuj: Czy trzyma głowę prosto.; Czy kontroluje tempo.; Ile razy upuszcza woreczek.
045 Kamienie na rzece [Równowaga, 3–7 lat] Przejdź przez „rzekę” po kamieniach z kartonu, nie dotykając podłogi. Łatwiej: Kamienie blisko.; Trzymanie za rękę. Trudniej: Kamienie dalej.; Dwie trasy do wyboru. Obserwuj: Czy planuje kolejny krok.; Czy utrzymuje równowagę.; Czy szacuje odległość.
046 Chodzenie po sznurku [Równowaga, 4–8 lat] Idź boso po sznurku ułożonym w fale, czując go stopami. Łatwiej: Prosta trasa.; Chodzenie bokiem. Trudniej: Ostre zakręty.; Zamknięte oczy z asekuracją. Obserwuj: Czy czuje sznur stopami.; Czy nie schodzi z trasy.; Czy akceptuje bose stopy.
047 Pięta–palce [Równowaga, 5–9 lat] Idź po linii, dotykając piętą palców drugiej stopy przy każdym kroku. Łatwiej: Krótsza linia.; Kroki z małą przerwą. Trudniej: Chodzenie tyłem pięta–palce.; Ręce na biodrach. Obserwuj: Czy łączy piętę z palcami.; Czy utrzymuje linię.; Czy kontroluje tempo.
048 Poduszka sensoryczna [Równowaga, 3–7 lat] Stój, kucaj i podskakuj delikatnie na poduszce sensorycznej lub złożonym kocu. Łatwiej: Stanie z trzymaniem.; Bez podskoków. Trudniej: Łapanie piłki na poduszce.; Stanie na jednej nodze. Obserwuj: Czy szuka stabilnej pozycji.; Czy kontroluje kucanie.; Jak reaguje na niestabilność.
049 Zamrożony flaming [Równowaga, 4–8 lat] Tańcz przy muzyce i na stop zamarznij na jednej nodze jak flaming. Łatwiej: Zastyganie na dwóch nogach.; Krótkie pauzy. Trudniej: Długie pauzy.; Inne zwierzę na karcie. Obserwuj: Czy reaguje od razu.; Czy utrzymuje równowagę.; Czy panuje nad ruchem.
050 Tyłem po linii [Równowaga, 5–9 lat] Idź tyłem po linii z taśmy, stawiając stopę za stopą. Łatwiej: Szeroka linia.; Krótka trasa. Trudniej: Ręce na głowie.; Woreczek na głowie. Obserwuj: Czy kontroluje kierunek.; Czy stawia stopy na linii.; Czy się nie spieszy.
051 Piłeczka na łyżce [Równowaga, 4–8 lat] Przejdź trasę z piłeczką na łyżce, nie upuszczając jej. Łatwiej: Pompon zamiast piłeczki.; Krótka trasa. Trudniej: Trasa z przeszkodami do przejścia.; Trasa po linii. Obserwuj: Czy patrzy na łyżkę.; Czy dopasowuje tempo.; Ile razy upuszcza.
052 Wieża z klocków na stojąco [Równowaga, 4–8 lat] Buduj wieżę z klocków, stojąc na jednej nodze lub na poduszce. Łatwiej: Stanie na podłodze.; Duże klocki. Trudniej: Stanie na jednej nodze.; Wieża według wzoru. Obserwuj: Czy utrzymuje równowagę przy sięganiu.; Czy stawia klocki precyzyjnie.; Czy planuje.
053 Wspięcia na palce [Równowaga, 3–7 lat] Wspinaj się na palce, żeby „zerwać jabłko”, i powoli wracaj na pięty. Łatwiej: Jabłka niżej.; Trzymanie ściany. Trudniej: Wspięcie na jednej nodze.; Zatrzymanie na 5 sekund. Obserwuj: Czy utrzymuje się na palcach.; Czy wraca powoli.; Czy prostuje ciało.
054 Ławeczka nad rzeką [Równowaga, 4–8 lat] Przejdź po niskiej ławeczce lub desce jak po moście nad rzeką. Łatwiej: Szeroka deska na podłodze.; Trzymanie za rękę. Trudniej: Przejście z woreczkiem na głowie.; Przejście bokiem. Obserwuj: Czy utrzymuje równowagę.; Czy patrzy przed siebie.; Jak radzi sobie z obawą.
055 Tor równowagi [Równowaga, 4–9 lat] Pokonaj tor z kilku stacji równowagi: linia, poduszka, kamienie i ławeczka. Łatwiej: Mniej stacji.; Asekuracja na każdej stacji. Trudniej: Tor z woreczkiem na głowie.; Tor tyłem. Obserwuj: Która stacja jest najtrudniejsza.; Czy planuje kolejne kroki.; Czy utrzymuje uwagę.
056 Ścieżka dłoni i stóp [Lateralizacja, 3–7 lat] Idź po ścieżce z kolorowych dłoni i stóp, stawiając na nich właściwe ręce i nogi. Łatwiej: Same stopy.; Krótka ścieżka. Trudniej: Prawa i lewa w różnych kolorach.; Szybsze tempo. Obserwuj: Czy rozróżnia prawą i lewą.; Czy planuje ułożenie ciała.; Czy poprawia błędy.
057 Strzałki na podłodze [Lateralizacja, 4–8 lat] Skacz w kierunku, który pokazuje strzałka: w prawo, w lewo, do przodu i do tyłu. Łatwiej: Tylko prawo i lewo.; Wolne tempo. Trudniej: Szybkie zmiany.; Skok w przeciwną stronę. Obserwuj: Czy rozróżnia prawo i lewo.; Czy reaguje szybko.; Czy myli kierunki.
058 Prawa ręka, lewa noga [Lateralizacja, 5–9 lat] Dotykaj prawą ręką lewego kolana i odwrotnie, coraz szybciej. Łatwiej: Na siedząco.; Wolne tempo. Trudniej: Do muzyki.; Z zamkniętymi oczami. Obserwuj: Czy krzyżuje linię środkową.; Czy zachowuje naprzemienność.; Czy utrzymuje rytm.
059 Bransoletka na prawej ręce [Lateralizacja, 3–7 lat] Załóż bransoletkę na prawą rękę i wykonuj polecenia: prawa ręka, lewa ręka. Łatwiej: Polecenia tylko dla rąk.; Powolne tempo. Trudniej: Polecenia dla nóg i uszu.; Bez bransoletki. Obserwuj: Czy korzysta z bransoletki.; Czy rozróżnia strony.; Czy reaguje szybko.
060 Kierowca: w lewo, w prawo [Lateralizacja, 4–8 lat] Jedź „samochodem” z talerzem jako kierownicą i skręcaj w kierunku z poleceń. Łatwiej: Strzałki na kartach.; Wolna jazda. Trudniej: Tylko słowa bez gestów.; Jazda tyłem. Obserwuj: Czy skręca we właściwą stronę.; Czy reaguje na słowo.; Czy myli kierunki.
061 Dotknij przeciwnego kolana [Lateralizacja, 4–8 lat] Maszeruj i dotykaj łokciem przeciwnego kolana w rytm bębenka. Łatwiej: Dotyk dłonią zamiast łokcia.; Wolny rytm. Trudniej: Szybki rytm.; Na siedząco na piłce. Obserwuj: Czy krzyżuje linię środkową.; Czy utrzymuje rytm.; Czy zachowuje równowagę.
062 Szlaczek strzałek [Lateralizacja, 4–8 lat] Rysuj szlaczek ze strzałek według wzoru i pokazuj ręką ich kierunek. Łatwiej: Krótki wzór.; Duża kratka. Trudniej: Wzór z 4 kierunków.; Rysowanie z pamięci. Obserwuj: Czy rozróżnia kierunki.; Czy kontynuuje wzór.; Czy pilnuje linii.
063 Lustrzane odbicie [Lateralizacja, 5–9 lat] Stań naprzeciw dorosłego i powtarzaj jego ruchy jak lustro. Łatwiej: Ruchy symetryczne.; Bardzo wolne tempo. Trudniej: Ruchy jednej strony.; Szybsze ruchy. Obserwuj: Czy odbija stronę poprawnie.; Czy utrzymuje uwagę.; Czy reaguje na zmianę.
064 Rzut prawą, rzut lewą [Lateralizacja, 4–8 lat] Rzucaj woreczkiem do celu raz prawą, raz lewą ręką. Łatwiej: Cel bliżej.; Duży cel. Trudniej: Cel dalej.; Rzut z jednej nogi. Obserwuj: Która ręka jest dominująca.; Czy celuje słabszą ręką.; Czy pamięta zmianę.
065 Kolorowe rękawiczki [Lateralizacja, 3–7 lat] Z różnokolorowymi skarpetkami na dłoniach wykonuj polecenia „czerwona do góry”. Łatwiej: Tylko kolory.; Wolne tempo. Trudniej: Same słowa prawo–lewo.; Polecenia z piłką. Obserwuj: Czy łączy kolor ze stroną.; Czy przechodzi na słowa.; Czy reaguje szybko.
066 Ósemka w powietrzu [Lateralizacja, 4–8 lat] Rysuj w powietrzu dużą leżącą ósemkę wstążką, jedną i dwiema rękami. Łatwiej: Ósemka na tablicy.; Prowadzenie ręki dziecka. Trudniej: Dwie ręce naraz.; Z zamkniętymi oczami. Obserwuj: Czy przekracza linię środkową.; Czy ruch jest płynny.; Czy obie ręce pracują.
067 Kroki krzyżowe [Lateralizacja, 5–9 lat] Idź bokiem, krzyżując nogi raz z przodu, raz z tyłu. Łatwiej: Tylko krzyżowanie z przodu.; Trzymanie za rękę. Trudniej: Szybsze tempo.; Do muzyki. Obserwuj: Czy pamięta kolejność.; Czy utrzymuje równowagę.; Czy patrzy pod nogi.
068 Robot słucha poleceń [Lateralizacja, 4–8 lat] Bądź robotem: rób kroki i obroty według poleceń „2 kroki w prawo”. Łatwiej: Pojedyncze polecenia.; Strzałki na kartach. Trudniej: Dwa polecenia naraz.; Dziecko programuje dorosłego. Obserwuj: Czy liczy kroki.; Czy skręca we właściwą stronę.; Czy pamięta polecenie.
069 Skarb po lewej, skarb po prawej [Lateralizacja, 4–8 lat] Szukaj skarbów schowanych po lewej i po prawej stronie według wskazówek. Łatwiej: Wskazówki z gestem.; Skarby widoczne. Trudniej: Wskazówki tylko słowami.; Dwie wskazówki naraz. Obserwuj: Czy rozróżnia strony.; Czy orientuje się od siebie.; Czy pamięta wskazówkę.
070 Taniec prawej i lewej strony [Lateralizacja, 4–8 lat] Tańcz do piosenki, ruszając tylko tą stroną ciała, którą wskazuje karta. Łatwiej: Tylko ręce.; Wolna piosenka. Trudniej: Szybkie zmiany kart.; Bez szarf. Obserwuj: Czy rusza właściwą stroną.; Czy reaguje na zmianę.; Czy utrzymuje rytm.
071 Przed lustrem [Schemat ciała, 3–7 lat] Dotykaj przed lustrem części twarzy i ciała, które nazywa dorosły. Łatwiej: Tylko części twarzy.; Pokazywanie razem. Trudniej: Części mniej znane (łokieć, kostka).; Bez lustra. Obserwuj: Czy zna nazwy.; Czy dotyka właściwej części.; Czy patrzy w lustro.
072 Pokaż, gdzie jest… [Schemat ciała, 3–6 lat] Na hasło „pokaż, gdzie jest…” jak najszybciej wskaż część ciała. Łatwiej: Karty z obrazkiem.; Wolne tempo. Trudniej: Dwie części naraz.; Części na kolegę. Obserwuj: Czy zna nazwy.; Czy reaguje szybko.; Czy myli części.
073 Obrys ciała na papierze [Schemat ciała, 4–8 lat] Połóż się na dużym papierze, dorosły obrysowuje ciało, a dziecko dorysowuje części. Łatwiej: Dorysowanie z pomocą.; Tylko twarz. Trudniej: Podpisanie 10 części.; Dorysowanie ubrania. Obserwuj: Czy rysuje części we właściwych miejscach.; Czy zna nazwy.; Czy akceptuje dotyk mazaka.
074 Puzzle z części ciała [Schemat ciała, 3–7 lat] Ułóż ludzika z pociętych części ciała i nazwij każdą z nich. Łatwiej: Mniej części.; Wzór pod spodem. Trudniej: Więcej części (dłonie, stopy).; Bez wzoru. Obserwuj: Czy układa części logicznie.; Czy zna nazwy.; Czy zauważa błędy.
075 Szymon mówi [Schemat ciała, 4–9 lat] Wykonuj polecenia tylko wtedy, gdy zaczynają się od słów „Szymon mówi”. Łatwiej: Bez pułapek.; Wolne tempo. Trudniej: Szybkie polecenia.; Polecenia dla jednej strony ciała. Obserwuj: Czy hamuje ruch bez hasła.; Czy zna części ciała.; Czy utrzymuje uwagę.
076 Naklejki na ciele [Schemat ciała, 3–6 lat] Przyklejaj kolorowe naklejki na wskazane części ciała i odklejaj je. Łatwiej: Duże naklejki.; Części widoczne w lustrze. Trudniej: Części na plecach z lustrem.; Polecenia słowne bez kart. Obserwuj: Czy znajduje części.; Czy akceptuje dotyk.; Czy nazywa części.
077 Posągi z kart [Schemat ciała, 4–8 lat] Odtwórz pozycję ludzika z karty i zastygnij jak posąg. Łatwiej: Proste pozycje.; Lustro obok. Trudniej: Pozycje na jednej nodze.; Pozycja z pamięci. Obserwuj: Czy odwzorowuje ułożenie rąk i nóg.; Czy utrzymuje pozycję.; Czy porównuje z kartą.
078 Którą część dotykam? [Schemat ciała, 4–8 lat] Z zamkniętymi oczami zgadnij, której części ciała dotyka piórko. Łatwiej: Oczy otwarte.; Tylko ręce i nogi. Trudniej: Dwa dotknięcia naraz.; Dotyk na plecach. Obserwuj: Czy lokalizuje dotyk.; Czy zna nazwy.; Czy akceptuje dotyk.
079 Głowa, ramiona, kolana, palce [Schemat ciała, 3–7 lat] Śpiewaj piosenkę i dotykaj kolejno głowy, ramion, kolan i palców u stóp. Łatwiej: Bardzo wolne tempo.; Tylko 2 części. Trudniej: Szybkie tempo.; Pominięte słowa tylko ruchem. Obserwuj: Czy dotyka właściwych części.; Czy utrzymuje rytm.; Czy pamięta kolejność.
080 Ludzik z patyczków [Schemat ciała, 4–8 lat] Ułóż ludzika z patyczków i plasteliny w tej samej pozycji, co ty. Łatwiej: Pozycja stojąca.; Pomoc w łączeniu. Trudniej: Pozycja w ruchu.; Pozycja kolegi. Obserwuj: Czy odwzorowuje kąty rąk i nóg.; Czy zna proporcje.; Czy porównuje.
081 Ciało w obręczy [Schemat ciała, 3–7 lat] Wkładaj do obręczy tylko te części ciała, które wymienia dorosły. Łatwiej: Ręce i nogi.; Karty z obrazkiem. Trudniej: Dwie części naraz.; Części jednej strony. Obserwuj: Czy zna części ciała.; Czy planuje ułożenie.; Czy zachowuje równowagę.
082 Masaż piłeczką [Schemat ciała, 3–7 lat] Tocz miękką piłeczkę po ramionach, nogach i plecach, nazywając części ciała. Łatwiej: Tylko własne ręce.; Bardzo miękka piłka. Trudniej: Masaż w parach.; Nazywanie każdej części. Obserwuj: Czy akceptuje nacisk.; Czy nazywa części.; Czy się wycisza.
083 Cień na ścianie [Schemat ciała, 4–8 lat] Twórz cienie ciała na ścianie z latarką i zgaduj, co przedstawiają. Łatwiej: Proste kształty.; Latarka blisko. Trudniej: Cienie z dłoni.; Kształty w parach. Obserwuj: Czy rozumie związek ruchu i cienia.; Czy odtwarza kształt.; Jak reaguje na półmrok.
084 Ułóż ludzika z kart [Schemat ciała, 4–8 lat] Na podstawie opisu ułóż ludzika z kart: głowa, ręce, nogi i ubranie. Łatwiej: Krótki opis.; Mniej kart. Trudniej: Długi opis.; Opis z pamięci. Obserwuj: Czy rozumie opis.; Czy układa logicznie.; Czy zna słownictwo.
085 Ruchomy ludzik [Schemat ciała, 4–8 lat] Ustaw ludzika z kartonu w pozycji, a potem odtwórz ją własnym ciałem. Łatwiej: Proste pozycje.; Lustro obok. Trudniej: Pozycje asymetryczne.; Sekwencja 2 pozycji. Obserwuj: Czy odtwarza kąty.; Czy rozróżnia strony.; Czy planuje ruch.
086 Labirynt na podłodze [Orientacja w przestrzeni, 4–8 lat] Przejdź labirynt z taśmy na podłodze, nie przekraczając ścian. Łatwiej: Prosty labirynt.; Szerokie korytarze. Trudniej: Labirynt ze ślepymi uliczkami.; Przejście z zadaniem. Obserwuj: Czy planuje drogę.; Czy trzyma się korytarzy.; Czy wraca po błędzie.
087 Na, pod, obok [Orientacja w przestrzeni, 3–6 lat] Połóż misia na, pod, obok, przed i za krzesłem według poleceń. Łatwiej: Trzy pojęcia.; Gesty przy poleceniach. Trudniej: Wszystkie pojęcia.; Dziecko samo staje na, pod, obok. Obserwuj: Czy rozumie pojęcia.; Czy używa ich w mowie.; Czy myli przed i za.
088 Skarb na mapie [Orientacja w przestrzeni, 5–9 lat] Znajdź skarb w pokoju, korzystając z prostej mapy narysowanej przez dorosłego. Łatwiej: Mapa z obrazkami mebli.; Skarb widoczny. Trudniej: Mapa bez obrazków.; Dziecko rysuje mapę dla ciebie. Obserwuj: Czy rozumie plan.; Czy orientuje mapę.; Czy planuje drogę.
089 W środku i na zewnątrz [Orientacja w przestrzeni, 3–6 lat] Skacz do obręczy i z obręczy na hasła „do środka” i „na zewnątrz”. Łatwiej: Wolne tempo.; Jedna obręcz. Trudniej: Pułapki: dwa takie same hasła.; Kilka obręczy. Obserwuj: Czy rozumie pojęcia.; Czy reaguje szybko.; Czy hamuje w pułapce.
090 Droga do domku [Orientacja w przestrzeni, 4–8 lat] Poprowadź zabawkę po drodze z taśmy do jej domku, wybierając właściwe skrzyżowania. Łatwiej: Jedno skrzyżowanie.; Strzałki na drodze. Trudniej: Kilka zabawek z różnymi celami.; Wskazówki słowne. Obserwuj: Czy planuje trasę.; Czy rozumie wskazówki.; Czy pamięta cel.
091 Przed krzesłem, za krzesłem [Orientacja w przestrzeni, 3–6 lat] Ustaw się przed, za, obok lub na krześle na hasło dorosłego. Łatwiej: Gest przy haśle.; Dwa pojęcia. Trudniej: Szybkie tempo.; Dwa krzesła. Obserwuj: Czy rozumie pojęcia.; Czy nazywa położenie.; Czy myli przed i za.
092 Kratka na podłodze [Orientacja w przestrzeni, 5–9 lat] Przejdź po kratce z taśmy według zakodowanych strzałek do celu. Łatwiej: Kod z 3 strzałek.; Strzałki na kratce. Trudniej: Kod z 6 strzałek.; Dziecko układa kod dla ciebie. Obserwuj: Czy czyta kod.; Czy liczy kratki.; Czy poprawia błędy.
093 Wyżej, niżej [Orientacja w przestrzeni, 3–6 lat] Unoś balon wyżej lub niżej według poleceń i ustawiaj ciało w różnej wysokości. Łatwiej: Tylko wyżej–niżej.; Wolne tempo. Trudniej: Najwyżej i najniżej.; Pary z jednym balonem. Obserwuj: Czy rozumie pojęcia.; Czy kontroluje balon.; Czy zmienia wysokość ciała.
094 Gdzie schował się miś? [Orientacja w przestrzeni, 3–6 lat] Znajdź misia schowanego w pokoju i powiedz, gdzie był: pod, na, za, w. Łatwiej: Miś częściowo widoczny.; Wskazówki ciepło–zimno. Trudniej: Bez wskazówek.; Dziecko chowa misia dla ciebie. Obserwuj: Czy szuka systematycznie.; Czy nazywa położenie.; Czy pamięta poprzednie kryjówki.
095 Tor według planu [Orientacja w przestrzeni, 5–9 lat] Zbuduj tor z przeszkód według rysunku na karcie, a potem go pokonaj. Łatwiej: Plan z 3 elementów.; Pomoc w ustawianiu. Trudniej: Plan z 6 elementów.; Dziecko rysuje plan. Obserwuj: Czy odwzorowuje położenie.; Czy porównuje z planem.; Czy planuje kolejność.
096 Kroki według strzałek [Orientacja w przestrzeni, 4–8 lat] Rób kroki w kierunkach strzałek pokazywanych na kartach: przód, tył, prawo, lewo. Łatwiej: Tylko przód–tył.; Wolne tempo. Trudniej: Sekwencje 3 kart.; Szybkie tempo. Obserwuj: Czy rozumie kierunki.; Czy wraca na środek.; Czy pamięta sekwencję.
097 Duży krok, mały krok [Orientacja w przestrzeni, 3–7 lat] Dojdź do celu dużymi lub małymi krokami i policz, ile ich było. Łatwiej: Krótka odległość.; Liczenie razem. Trudniej: Szacowanie przed pójściem.; Kroki „mrówki” i „olbrzyma”. Obserwuj: Czy kontroluje długość kroku.; Czy liczy poprawnie.; Czy szacuje.
098 Pociąg z pudełek [Orientacja w przestrzeni, 3–6 lat] Ciągnij pociąg z pudełek po trasie i ustawiaj wagony w kolejności. Łatwiej: Krótki pociąg.; Prosta trasa. Trudniej: Jazda tyłem.; Kolejność wagonów według koloru. Obserwuj: Czy kontroluje kierunek.; Czy omija przeszkody.; Czy rozumie pierwszy–ostatni.
099 Ślady stóp do mety [Orientacja w przestrzeni, 3–7 lat] Idź po śladach stóp ułożonych na podłodze: raz szeroko, raz wąsko, raz w zygzak. Łatwiej: Ślady blisko.; Prosta linia. Trudniej: Zygzak i skoki.; Ślady tyłem. Obserwuj: Czy dopasowuje krok.; Czy patrzy na ślady.; Czy utrzymuje rytm.
100 Wyprawa po pokoju [Orientacja w przestrzeni, 5–9 lat] Wykonaj trasę po pokoju według 3–4 słownych wskazówek naraz. Łatwiej: 2 wskazówki.; Karty z obrazkami. Trudniej: 4 wskazówki.; Wskazówki z prawo–lewo. Obserwuj: Czy pamięta wskazówki.; Czy rozumie pojęcia.; Czy planuje trasę.
101 Skoki w rytm bębenka [Rytm i sekwencja, 3–7 lat] Skacz do obręczy tylko wtedy, gdy uderza bębenek, i zatrzymuj się w ciszy. Łatwiej: Wolny, równy rytm.; Dwie obręcze. Trudniej: Zmienny rytm.; Dwa uderzenia, dwa skoki. Obserwuj: Czy słyszy rytm.; Czy synchronizuje skok.; Czy hamuje w ciszy.
102 Posągi przy muzyce [Rytm i sekwencja, 3–8 lat] Tańcz przy muzyce, a gdy ucichnie, zastygnij jak posąg. Łatwiej: Krótkie pauzy.; Dowolna pozycja. Trudniej: Zastyganie w pozycji z karty.; Długie pauzy. Obserwuj: Czy zatrzymuje się od razu.; Czy utrzymuje bezruch.; Czy panuje nad emocjami.
103 Klaskanie wzorów [Rytm i sekwencja, 4–8 lat] Powtarzaj rytmy wyklaskane przez dorosłego: klaśnięcia, tupnięcia i pauzy. Łatwiej: Wzory z 3 dźwięków.; Klaskanie razem. Trudniej: Wzory z 6 dźwięków.; Klaskanie i tupanie. Obserwuj: Czy powtarza dokładnie.; Czy pamięta długość.; Czy utrzymuje tempo.
104 Szybko i wolno [Rytm i sekwencja, 3–7 lat] Maszeruj szybko lub wolno w zależności od tempa bębenka. Łatwiej: Tylko dwa tempa.; Karty z obrazkiem. Trudniej: Trzy tempa.; Zmiany bez ostrzeżenia. Obserwuj: Czy słyszy zmianę.; Czy dopasowuje tempo.; Czy kontroluje ruch.
105 Marsz i bieg na sygnał [Rytm i sekwencja, 4–8 lat] Na jeden dźwięk maszeruj, na dwa biegnij, na trzy zatrzymaj się. Łatwiej: Dwa sygnały.; Karty z liczbą. Trudniej: Cztery sygnały.; Sygnały szybciej. Obserwuj: Czy pamięta znaczenie sygnałów.; Czy reaguje szybko.; Czy hamuje.
106 Echo rytmu [Rytm i sekwencja, 4–8 lat] Powtarzaj jak echo rytmy wystukane na kolanach, brzuchu i podłodze. Łatwiej: Rytmy z 3 uderzeń.; Jedno miejsce. Trudniej: Rytmy w różnych miejscach ciała.; Echo z zamkniętymi oczami. Obserwuj: Czy powtarza dokładnie.; Czy zapamiętuje.; Czy patrzy i słucha.
107 Taniec ze wstążką [Rytm i sekwencja, 3–7 lat] Tańcz ze wstążką: duże koła, fale i spirale w tempie muzyki. Łatwiej: Jeden ruch.; Wolna muzyka. Trudniej: Ruchy na zmianę rękami.; Ruch według kart. Obserwuj: Czy dopasowuje tempo.; Czy ruchy są płynne.; Czy używa całego ciała.
108 Sekwencja ruchów [Rytm i sekwencja, 5–9 lat] Zapamiętaj i wykonaj sekwencję 3–5 ruchów pokazanych na kartach. Łatwiej: Karty zostają widoczne.; Sekwencja z 2 ruchów. Trudniej: Sekwencja z 5 ruchów.; W rytm muzyki. Obserwuj: Czy pamięta kolejność.; Czy wykonuje płynnie.; Czy poprawia błędy.
109 Kroki do wierszyka [Rytm i sekwencja, 3–7 lat] Mów wierszyk i rób krok na każdą sylabę. Łatwiej: Klaskanie zamiast kroków.; Krótki wierszyk. Trudniej: Skoki zamiast kroków.; Wierszyk szeptem. Obserwuj: Czy dzieli na sylaby.; Czy synchronizuje krok.; Czy pamięta tekst.
110 Orkiestra z ciała [Rytm i sekwencja, 4–9 lat] Grajcie rytm ciałem: klaskanie, tupanie, pstrykanie i uderzanie w kolana. Łatwiej: Dwa instrumenty.; Wolne tempo. Trudniej: Cztery instrumenty naraz.; Dziecko dyryguje. Obserwuj: Czy czeka na swój znak.; Czy utrzymuje rytm.; Czy słucha innych.
111 Polecenie z zaskoczenia [Uwaga i planowanie ruchu, 4–9 lat] Biegaj swobodnie i natychmiast wykonaj zaskakujące polecenie dorosłego. Łatwiej: Trzy polecenia.; Polecenie z kartą. Trudniej: Polecenia złożone.; Pułapki bez gwizdka. Obserwuj: Czy reaguje szybko.; Czy rozumie polecenie.; Czy hamuje ruch.
112 Pamięć w ruchu [Uwaga i planowanie ruchu, 4–8 lat] Biegaj do kart leżących obrazkiem w dół i szukaj par, odkrywając po dwie. Łatwiej: 4 pary.; Karty blisko startu. Trudniej: 8 par.; Bieg slalomem. Obserwuj: Czy pamięta położenie.; Czy szuka systematycznie.; Czy utrzymuje uwagę.
113 Stop i start [Uwaga i planowanie ruchu, 3–7 lat] Idź na zielone światło, zatrzymaj się na czerwone, zwolnij na żółte. Łatwiej: Tylko zielone i czerwone.; Wolne zmiany. Trudniej: Szybkie zmiany.; Karty bez koloru (tylko słowa). Obserwuj: Czy zatrzymuje się od razu.; Czy rozpoznaje kolory.; Czy kontroluje tempo.
114 Zakazany kolor [Uwaga i planowanie ruchu, 5–9 lat] Skacz po kolorowych polach, ale nigdy nie stawaj na zakazanym kolorze. Łatwiej: Jeden zakazany kolor.; Pola blisko. Trudniej: Zmiana zakazanego koloru w trakcie.; Dwa zakazane kolory. Obserwuj: Czy pamięta zasadę.; Czy hamuje ruch.; Czy reaguje na zmianę.
115 Kolorowe kroki [Uwaga i planowanie ruchu, 3–7 lat] Stawaj na polach w kolorze, który pokazuje karta lub mówi dorosły. Łatwiej: Duże pola.; Dwa kolory. Trudniej: Kolory tylko słowem.; Dwa kolory naraz (ręka i noga). Obserwuj: Czy rozpoznaje kolory.; Czy szybko znajduje pole.; Czy rozumie słowa.
116 Plan toru na kartce [Uwaga i planowanie ruchu, 5–9 lat] Narysuj własny tor przeszkód, zbuduj go i pokonaj zgodnie z planem. Łatwiej: Plan z 3 elementów.; Rysowanie razem. Trudniej: Plan z kolejnością ponumerowaną.; Tor dla kolegi. Obserwuj: Czy planuje logicznie.; Czy odwzorowuje plan.; Czy przewiduje trudności.
117 Słuchaj i rób [Uwaga i planowanie ruchu, 4–9 lat] Wykonaj kolejno 2–4 polecenia podane naraz, w tej samej kolejności. Łatwiej: Dwa polecenia.; Polecenia z gestem. Trudniej: Cztery polecenia.; Polecenia z pojęciami przestrzennymi. Obserwuj: Czy słucha do końca.; Czy pamięta kolejność.; Czy wykonuje wszystko.
118 Lustro w parze [Uwaga i planowanie ruchu, 5–9 lat] W parze jedno dziecko prowadzi powolne ruchy, a drugie powtarza je jak lustro. Łatwiej: Ruchy rąk.; Dorosły prowadzi. Trudniej: Ruchy całego ciała.; Bez ustalania lidera. Obserwuj: Czy utrzymuje uwagę na partnerze.; Czy dopasowuje tempo.; Jak współpracuje.
119 Liczę i skaczę [Uwaga i planowanie ruchu, 4–8 lat] Skacz tyle razy, ile kropek pokazuje karta, i licz na głos. Łatwiej: Karty do 3.; Liczenie razem. Trudniej: Karty do 10.; Skoki na jednej nodze. Obserwuj: Czy liczy poprawnie.; Czy synchronizuje liczenie i skok.; Czy kontroluje liczbę skoków.
120 Para w ruchu [Uwaga i planowanie ruchu, 4–8 lat] Biegaj po sali z kartą i na sygnał znajdź dziecko z pasującą kartą. Łatwiej: Proste obrazki.; Mała grupa. Trudniej: Pary skojarzeń (np. pies–kość).; Wymiana kart w biegu. Obserwuj: Czy szuka aktywnie.; Czy rozpoznaje parę.; Jak współpracuje.
121 Wielki tor przeszkód [Ćwiczenia łączone, 4–9 lat] Pokonaj tor z przeszkód łączący czołganie, skoki, równowagę i rzut. Łatwiej: Mniej stacji.; Asekuracja. Trudniej: Tor na czas.; Tor tyłem na wybranych stacjach. Obserwuj: Która stacja sprawia trudność.; Czy planuje przejścia.; Czy utrzymuje motywację.
122 Misja zwierząt [Ćwiczenia łączone, 3–7 lat] Wylosuj kartę zwierzęcia i pokonaj tor, poruszając się jak ono. Łatwiej: Znane zwierzęta.; Krótki tor. Trudniej: Dwa zwierzęta w jednej rundzie.; Zwierzę z pamięci. Obserwuj: Czy odtwarza ruch zwierzęcia.; Czy zmienia sposób poruszania.; Czy się angażuje.
123 Ścieżka olbrzymów [Ćwiczenia łączone, 4–8 lat] Idź ścieżką olbrzymów po dużych śladach i wróć jako mrówka po małych. Łatwiej: Ślady blisko.; Tylko jedna ścieżka. Trudniej: Ślady w zygzak.; Skoki olbrzyma. Obserwuj: Czy dopasowuje długość kroku.; Czy utrzymuje równowagę.; Czy wchodzi w rolę.
124 Fala z prześcieradła [Ćwiczenia łączone, 3–8 lat] Grupa trzyma prześcieradło i robi fale tak, żeby piłka nie spadła. Łatwiej: Bez piłki.; Wolne fale. Trudniej: Dwie piłki.; Piłka do „dziury” w rogu. Obserwuj: Czy dopasowuje ruch do grupy.; Czy słucha poleceń.; Czy kontroluje siłę.
125 Bezpieczna wyspa [Ćwiczenia łączone, 3–7 lat] Biegaj wokół wysp z mat, a na sygnał „rekin!” wskocz na najbliższą wyspę. Łatwiej: Dużo wysp.; Wolny bieg. Trudniej: Zabieranie wysp co rundę.; Zadanie na wyspie. Obserwuj: Czy reaguje szybko.; Czy dzieli się miejscem.; Czy utrzymuje równowagę.
126 Mała poczta [Ćwiczenia łączone, 4–8 lat] Bądź listonoszem: zabierz list, odczytaj kolor lub obrazek i zanieś do właściwej skrzynki. Łatwiej: Trzy skrzynki.; Kolory zamiast obrazków. Trudniej: Pięć skrzynek.; Dwa listy naraz. Obserwuj: Czy rozpoznaje znaki.; Czy pamięta położenie skrzynek.; Czy pracuje systematycznie.
127 Tor kolorów i strzałek [Ćwiczenia łączone, 5–9 lat] Pokonaj tor, na którym kolory mówią, jak się ruszać, a strzałki, w którą stronę. Łatwiej: Tylko kolory.; Legenda widoczna. Trudniej: Kolory i strzałki naraz.; Legenda z pamięci. Obserwuj: Czy pamięta legendę.; Czy łączy dwie informacje.; Czy rozróżnia kierunki.
128 Most dla całej grupy [Ćwiczenia łączone, 4–9 lat] Grupa przechodzi przez „rzekę” na kilku kartonach, przekładając je do przodu. Łatwiej: Więcej kartonów.; Krótka rzeka. Trudniej: Mniej kartonów.; Przejście bez mówienia. Obserwuj: Czy grupa planuje razem.; Kto przejmuje inicjatywę.; Czy dzieci pomagają sobie.
129 Sztafeta z zadaniami [Ćwiczenia łączone, 5–9 lat] Drużyny biegną sztafetą, a na każdym pachołku wykonują zadanie z karty. Łatwiej: Proste zadania.; Bez rywalizacji na czas. Trudniej: Zadania z różnych obszarów.; Drużyny mieszane wiekowo. Obserwuj: Czy wykonuje zadanie dokładnie.; Czy kibicuje drużynie.; Jak przeżywa wygraną i przegraną.
130 Wielki finał: tor 5 obszarów [Ćwiczenia łączone, 5–9 lat] Tor z pięciu stacji, po jednej z każdego obszaru: podsumowanie całego cyklu. Łatwiej: 3 stacje.; Asekuracja i podpowiedzi. Trudniej: Tor na czas.; Kolejność stacji z pamięci. Obserwuj: Która stacja idzie najlepiej.; Gdzie potrzebna pomoc.; Postęp od początku cyklu.

12 ĆWICZEŃ WYCISZAJĄCYCH (bonus zestawu): 1. Balon w brzuchu; 2. Zdmuchnij świeczkę; 3. Śpiący lew; 4. Ciepłe dłonie; 5. Masaż piłeczką; 6. Pizza na plecach; 7. Ślimak; 8. Spokojne kroki; 9. Słuchanie ciszy; 10. Kanapka z koca; 11. Kamień i piórko; 12. Moje miejsce

BONUSY ZESTAWU: Karty do wycinania (części ciała, prawo-lewo, zwierzęta, kolory, polecenia) · Plan na 4 tygodnie (12 sesji: rozgrzewka, ćwiczenie główne, wyciszenie) · Arkusz obserwacji (ocena 1–3 po każdym ćwiczeniu) · Pomoce za zero złotych (pachołki z butelek, tunel z krzeseł i koca, itp.) · 12 ćwiczeń wyciszających · Karty do domu (10 ćwiczeń dla rodziców, 10 minut) · Dostosowania specjalne (zasady: tempo, bodźce, przestrzeń, kontakt; autyzm, ADHD, opóźnienie ruchowe, unikanie dotyku) · 12 błyskawicznych sesji po 10 minut.
BONUSY SUPERWIZJI W KIESZENI: 40 trudnych przypadków (odmowa, pobudzenie, lęk, wrażliwość sensoryczna, uwaga, grupa) · Drabinki trudności (każda karta w 4 stopniach: 1 pełne wsparcie = obie zmiany «łatwiej» + pomoc dorosłego, 2 łatwiej, 3 wersja z karty, 4 trudniej; zasada 2 z 3: wyżej, gdy dziecko robi pewnie w 2 sesjach z 3; niżej, gdy 2 razy z rzędu odmawia) · Sygnały ostrzegawcze (kiedy zasugerować konsultację i jak powiedzieć rodzicom) · Pakiet „Pierwsza trudna sesja” (30 minut: powitanie z planem z obrazków, rozgrzewka 079 lub 102, karta 042 na stopniu 1, karta 013, wyciszenie 1 i 12).
BUDOWA SESJI: rozgrzewka 5–10 min, ćwiczenie główne 15–20 min, wyciszenie 5 min.`
};
/* ===================================================================== */

const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;

let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }

function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "• "); }

burbuja(CHAT.bienvenida, "bot");
historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => preguntar(s); chips.append(b); });

async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}

async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
</script>
