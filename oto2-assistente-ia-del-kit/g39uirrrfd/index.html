IL SUPERVISORE IN TASCA (questo pacchetto): 40 Situazioni Difficili (1. «Io queste cose non le faccio»; 2. «Oggi no, sono stanca/o»; 3. «Sono troppo vecchia/o per queste cose»; 4. «Sono esercizi da bambini»; 5. Vuole solo parlare; 6. Si annoia dopo pochi minuti; 7. Non vede a cosa serve; 8. Vuole fare troppo; 9. Ha paura di alzarsi; 10. Paura dopo una caduta recente; 11. Si aggrappa forte a te; 12. Guarda sempre a terra; 13. Ansia prima della seduta; 14. Si vergogna davanti al gruppo; 15. Non vuole lasciare il bastone; 16. Senza fiato dopo pochi esercizi; 17. Dolore articolare che conosce già; 18. Dolore nuovo, improvviso; 19. Capogiro quando si alza; 20. Mani doloranti o rigide; 21. Ripartire dopo un ricovero; 22. Giorni sì e giorni no; 23. Piedi o caviglie gonfie; 24. Non segue le istruzioni; 25. Perde la sequenza a metà; 26. Si confonde e vuole andare via; 27. Fa sempre la stessa domanda; 28. Non sente bene; 29. Vede poco; 30. Si offende se la/lo correggi; 31. Più agitata/o nel pomeriggio; 32. Una persona domina il gruppo; 33. Una persona si isola; 34. Livelli molto diversi; 35. Due persone litigano; 36. Il gruppo chiacchiera e si distrae; 37. Chi arriva tardi o va via prima; 38. Spazio piccolo e niente attrezzi; 39. Il familiare interviene troppo; 40. Tra una seduta e l'altra non fa niente)
Scale di Adattamento a 4 Gradini: 1 Con aiuto (variante più facile, metà ripetizioni, operatore accanto, due mani sull'appoggio) · 2 Più facile · 3 Scheda · 4 Più impegnativo. Regola del 2 su 3: si sale quando l'esercizio riesce bene in 2 sedute su 3; si scende se per 2 volte di fila non riesce o compare dolore.
Quando Fermarsi: 112 per dolore al petto, grave difficoltà a respirare, segni di ictus (viso, braccio, parola), perdita di coscienza, caduta con dolore forte o colpo alla testa. Interrompere e avvisare per capogiro, fiato corto insolito, palpitazioni, dolore nuovo, confusione nuova, nausea e sudore freddo, gonfiore improvviso di una gamba.
Piano «Prima Seduta Difficile»: 30 minuti da seduti: chiacchiera e cartellino, Riscaldamento e Defaticamento 4 con musica, Coordinazione 4 e 5, un solo esercizio (Esercizi da Seduti 2 o 1) al gradino 1, Riscaldamento e Defaticamento 2.
STRUTTURA DI UNA SEDUTA: riscaldamento 5-8 min (guida Riscaldamento e Defaticamento 1-5), parte centrale 15-25 min, defaticamento 5 min (Riscaldamento e Defaticamento 6-7).`

const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;

let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }

function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "• "); }

burbuja(CHAT.bienvenida, "bot");
historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => preguntar(s); chips.append(b); });

async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}

async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
</script>
