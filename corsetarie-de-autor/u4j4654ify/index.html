<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acces</title>
<style>
  :root { --paper:#F8F3ED; --ink:#1C1817; --muted:#66584F; --wine:#43161C; --gold:#B58E5E; }
  html,body { margin:0; padding:0; background:var(--paper); }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:Arial, Helvetica, sans-serif; color:var(--ink); padding:24px; box-sizing:border-box; }
  .box { max-width:460px; text-align:center; }
  .rule { width:48px; height:2px; background:var(--gold); margin:0 auto 20px; }
  h1 { font-family:Georgia, 'Times New Roman', serif; font-weight:400; font-size:26px;
       line-height:1.3; color:var(--wine); margin:0 0 12px; }
  p { font-size:16px; line-height:1.6; color:var(--muted); margin:0; }
</style>
</head>
<body>
  <div class="box">
    <div class="rule"></div>
    <h1>Pagina de acces</h1>
    <p>Conținutul se încarcă în curând.</p>
  </div>
</body>
</html>
