KATALÓGUS ÉS ANYAGOK:
40 ILLESZKEDÉSI PROBLÉMA (szám · probléma · mit látsz · valószínű ok · javítás):
[Fűző · felső rész]
1 · A kivágás eláll a testtől · A felső szél és a mell között levegő van · Ok: A szabásmintán a mellbőség nagyobb, mint a vevőé, vagy a felső szél túl magasan van · Javítás: A próbadarabon tűzd össze és jelöld be a felesleget; ezt az értéket vedd el az elülső és az oldalvarrásokon elosztva, csak a mell vonalában, és lágyítsd a derékig futó ívet.
2 · Fent felnyomja a mellet („túlbuggyanás”) · A mell kiemelkedik a szél felett · Ok: Kevés a mellbőség, vagy a szabásminta kosarai kicsik az ő mellére · Javítás: Bontsd fel a mellpanelek varrását, és add hozzá, ami hiányzik, elosztva az elülső panelek között; ha a kivágás túl alacsony az ő mellére, emeld meg a felső szélt.
3 · A mell alatt vízszintes ránc keletkezik · Egyik oldaltól a másikig futó ránc a mell alatt · Ok: Az elülső hossz a derékig nagyobb, mint a vevőé, vagy a mell alatti körméret túl bő · Javítás: Jelöld be a felesleget a próbadarabon, és rövidítsd a szabásmintát a mell alatti vonalban, vagy vedd el a mell alatti körméretet az elülső varrásokon.
4 · A kosarak elállnak vagy horpadás keletkezik bennük · Az anyag nem fekszik fel a mellre · Ok: A kosár térfogata nagyobb, mint a vevő mellének térfogata · Javítás: Csökkentsd a mellvarrás ívét (vedd el a térfogatot az ív csúcsán), és próbáld fel újra; a körméretet ne vedd el.
5 · A felső szél bevág a hónalj alatt · Zavar, amikor leengedi a karját · Ok: Az oldalrész túl magasan van · Javítás: Az oldalon fokozatosan vidd le a felső szélt 1-2 cm-rel, és kösd rá az ívet az elülső és a hátsó panelre.

[Fűző · derék és csípő]

[Fűző · hát és záródás]

14 MÉRET (a „Hogyan vegyél méretet a vevődről” útmutatóból):
1. Mellbőség a mellen át: A mell legszélesebb pontján, a centi vízszintesen és húzás nélkül.
2. Mell alatti körméret: Közvetlenül a mell alatt, ahol a melltartó pántja fekszik. Szorosan, de húzás nélkül.
3. Derékbőség: A törzs legszűkebb pontján. Kösd rá a szalagot, és kérd meg, hogy mozduljon meg: a szalag magától lecsúszik a derékba.
4. Felső csípőbőség: Körülbelül 10 cm-rel a derék alatt, a csípőcsontok magasságában.
5. Csípőbőség: A far legszélesebb pontján, a lábak összezárva.
6. Elülső hossz a derékig: A kulcscsontok közötti gödörtől a derékig, középen.
7. Hátsó hossz a derékig: A nyak tövén kiálló csigolyától a derékig.
8. Mellmagasság: Onnan, ahol a váll a nyakkal találkozik, a mellpontig.
9. Mellpontok távolsága: A két mellpont közötti távolság.
10. A mell alatti vonaltól a derékig: Elöl, a mell alatti vonaltól a derékig.
11. A deréktól a csípőig (magasság): Az oldalon, a deréktól a csípő legszélesebb pontjáig.
12. Hátszélesség: Hónaljtól hónaljig a háton át, a karok lazán a test mellett.
13. A deréktól a comb tövéig ülve: Ülve, elöl, a deréktól a láb hajlatáig. Ez határozza meg a fűző legnagyobb hosszát.
14. Törzshossz (bodyhoz): A válltól az elülső oldalon és az ágyékon át vissza ugyanahhoz a vállhoz, a háton keresztül.

A SZABÁSMINTA IGAZÍTÁSA: hasonlítsd össze a szabásmintát és a vevőt a mellen át, a mell alatt, a derékban, a felső csípőn és a csípőn (a test fele, varrásszél nélkül); a különbséget oszd el a szabásminta felén lévő összes függőleges varrásszélre, az elülső közép (busk) és a hátsó közép (ringlik) elmozdítása nélkül; kösd össze lágy ívekkel; ha a különbség egyenetlen, többet az oldalpanelekre és a csípőn átfutó panelekre. Hossz: vízszintes vonal a mell alatti vonal és a derék között (és a derék és a csípő között), elvágni és elhúzni a hosszabbításhoz, egymásra hajtani a rövidítéshez. Kosár: több vagy kevesebb ív a mellvarrásokban, a körméret megváltoztatása nélkül. Fehérnemű: a hátsó pánt a mell alatti körméret szerint, az anyag rugalmasságával; body = törzshossz, a derékban javítjuk; bugyi = gumi és fedés.
AZ ELSŐ PRÓBA TERVE (sorrend): 1 záródás (egyenletes hézag a háton, 4-5 cm) · 2 hossz (a derék az ő derekán van, le tud ülni) · 3 körméret (összetűzni és bejelölni) · 4 forma (kosarak, ívek, ráncok) · 5 mozgás (leülni, karok, előrehajolni) · 6 kényelem · 7 fotók. Utána: a javításokat átvinni a szabásmintára; két nagy javítás után új próbadarab.
ARANYSZABÁLY: mindig próbadarab a végleges anyag előtt; egyszerre egy dolgot javítani, ebben a sorrendben: hossz → körméret → forma.`
};
/* ===================================================================== */

const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;

let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }

function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "• "); }

burbuja(CHAT.bienvenida, "bot");
historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => preguntar(s); chips.append(b); });

async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}

async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
</script>
