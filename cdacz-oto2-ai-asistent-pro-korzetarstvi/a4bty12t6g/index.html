40 PROBLÉMŮ S PADNUTÍM (číslo · problém · co je vidět · pravděpodobná příčina · oprava):
[Korzet · horní část]

5 · Horní okraj se zařezává pod paží · Překáží, když spustí paže · Příčina: Bok je příliš vysoko · Oprava: Horní okraj na boku postupně sniž o 1 až 2 cm a křivku napoj na přední a zadní díl.
6 · Vypadá ploše a nevytvaruje prsa · Přední díl zůstává rovný · Příčina: Střih má rovnou siluetu, nebo má zákaznice větší prsa než základní střih · Oprava: Přidej křivku do švů prsních dílů, nebo zvol střih s větším objemem.

[Korzet · pas a boky]
9 · Záhyb v pase na boku · Šikmé záhyby ve výšce pasu · Příčina: Linie pasu na střihu neodpovídá jejímu skutečnému pasu · Oprava: Skutečný pas označ na zkušebním modelu stuhou a linii pasu na střihu posuň nahoru nebo dolů na všech dílech.

11 · Při sezení se zařezává do boků · Vadí vsedě · Příčina: Délka pod pasem je větší než její vzdálenost pas–stehno vsedě · Oprava: Zkrať spodní okraj vpředu a na boku, nebo ho vpředu víc vykroj nahoru.

28 · Záhyb v košíčku · Látka se krabatí · Příčina: Košíček je velký · Oprava: Uber objem ve švu košíčku, nebo přejdi na předchozí velikost košíčku.

29 · Body táhne od ramene do rozkroku · Táhne, když se protáhne nebo sedne · Příčina: Délka trupu na střihu je menší než její · Oprava: Prodluž střih v linii pasu: co chybí, polovinu na přední díl a polovinu na zadní.

14 MĚR (z „Jak Vzít Zákaznici Míry“):
1. Obvod hrudníku přes prsa: Přes nejširší místo prsou, metr vodorovně a bez utahování.
2. Obvod pod prsy: Těsně pod prsy, kde sedí obvodový pás podprsenky. Pevně, ale bez utahování.
3. Obvod pasu: V nejužším místě trupu. Uvaž stuhu a popros ji, ať se pohne: stuha sama sjede do pasu.
4. Horní obvod boků: Asi 10 cm pod pasem, ve výšce pánevních kostí.
5. Obvod boků: Přes nejširší místo hýždí, chodidla u sebe.
6. Přední délka do pasu: Od jamky mezi klíčními kostmi do pasu, středem.
7. Zadní délka do pasu: Od vystouplého obratle na spodku krku do pasu.
8. Výška prsou: Od místa, kde se rameno potkává s krkem, k prsnímu bodu.
9. Vzdálenost prsních bodů: Vzdálenost mezi oběma prsními body.
10. Od linie pod prsy k pasu: Vpředu, od linie pod prsy do pasu.
11. Od pasu k bokům (výška): Na boku, od pasu k nejširšímu místu boků.
12. Šířka zad: Od podpaží k podpaží přes záda, paže volně podél těla.
13. Od pasu ke stehnu vsedě: Vsedě, vpředu, od pasu k přehybu nohy. Určuje největší délku korzetu.
14. Délka trupu (na body): Od ramene přes přední stranu a rozkrok zpátky ke stejnému rameni přes záda.

PRŮVODCE ÚPRAVOU STŘIHU: porovnat střih a zákaznici přes prsa, pod prsy, v pase, v horním obvodu boků a v bocích (polovina těla, bez švových záložek); rozdíl rozdělit do všech svislých okrajů švů na polovině střihu, bez posouvání středu předku (busk) a středu zad (průchodky); napojit měkkými křivkami; když je rozdíl nerovnoměrný, víc na boční díly a díly přes boky. Délka: vodorovná čára mezi linií pod prsy a pasem (a mezi pasem a boky), rozstřihnout a oddálit pro prodloužení, přeložit pro zkrácení. Košíček: víc nebo méně křivky v prsních švech bez změny obvodu. Prádlo: obvodový pás podle obvodu pod prsy s pružností látky; body = délka trupu, opravuje se v pase; kalhotky = pruženka a krytí.
PLÁN PRVNÍ ZKOUŠKY (pořadí): 1 zapínání (rovnoměrná mezera na zádech 4 až 5 cm) · 2 délka (pas na jejím pase, může si sednout) · 3 obvod (sepnout a označit) · 4 tvar (košíčky, křivky, záhyby) · 5 pohyb (sednout, paže, předklon) · 6 pohodlí · 7 fotky. Potom: přenést opravy na střih; po dvou velkých opravách nový zkušební model.
ZLATÉ PRAVIDLO: vždy zkušební model před finální látkou; opravovat jednu věc po druhé, v pořadí délka → obvod → tvar.`
};
/* ===================================================================== */

const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;

let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }

function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "• "); }

burbuja(CHAT.bienvenida, "bot");
historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => preguntar(s); chips.append(b); });

async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}

async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
</script>
